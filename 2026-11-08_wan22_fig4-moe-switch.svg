<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <clipPath id="bar-t2v"><rect x="80" y="146" width="1240" height="64" rx="8"/></clipPath>
    <clipPath id="bar-i2v"><rect x="80" y="398" width="1240" height="64" rx="8"/></clipPath>
  </defs>

  <!-- ===== Figure title ===== -->
  <text x="60" y="46" font-size="18" font-weight="700" fill="#0f172a">A14B 的「MoE」怎么切：去噪时间轴上的专家换班点</text>

  <!-- ===== Legend (top-right) ===== -->
  <g>
    <rect x="1178" y="32" width="8" height="8" fill="#ea580c"/>
    <text x="1192" y="40" font-size="14" fill="#334155">高噪专家</text>
    <rect x="1266" y="32" width="8" height="8" fill="#7c3aed"/>
    <text x="1280" y="40" font-size="14" fill="#334155">低噪专家</text>
  </g>

  <!-- ================================================================
       上轴：T2V-A14B   shift = 12.0   40 步 = 26 步高噪 + 14 步低噪
       横条 x: 80 → 1320（宽 1240），按步数比例 26:14
       切换点 = 80 + 1240 × 26/40 = 886
       ================================================================ -->
  <text x="60" y="92" font-size="16" font-weight="700" fill="#0f172a">文生视频 A14B：40 步里，26 步高噪 + 14 步低噪</text>
  <g>
    <rect x="430" y="72" width="120" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="490" y="86" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" dominant-baseline="central">shift = 12.0</text>
  </g>

  <!-- row: 端点标注 + 切换点标注 -->
  <text x="80" y="130" font-size="14" fill="#475569">t = 1000（纯噪声）</text>
  <text x="1320" y="130" font-size="14" fill="#475569" text-anchor="end">t = 0（成片）</text>
  <text x="886" y="130" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">切换点 t = 875</text>

  <!-- 切换点竖直虚线 -->
  <line x1="886" y1="134" x2="886" y2="228" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 横条：26 步（高噪，橙） + 14 步（低噪，紫） -->
  <g clip-path="url(#bar-t2v)">
    <rect x="80"  y="146" width="806" height="64" fill="#ea580c"/>
    <rect x="886" y="146" width="434" height="64" fill="#7c3aed"/>
  </g>
  <text x="483" y="170" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">高噪专家</text>
  <text x="483" y="193" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">26 步</text>
  <text x="1103" y="170" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">低噪专家</text>
  <text x="1103" y="193" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">14 步</text>

  <!-- 步数刻度：0 / 10 / 20 / 30 / 40 -->
  <g>
    <line x1="80" y1="228" x2="1320" y2="228" stroke="#e2e8f0" stroke-width="1"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="80"   y1="228" x2="80"   y2="235"/>
      <line x1="390"  y1="228" x2="390"  y2="235"/>
      <line x1="700"  y1="228" x2="700"  y2="235"/>
      <line x1="1010" y1="228" x2="1010" y2="235"/>
      <line x1="1320" y1="228" x2="1320" y2="235"/>
    </g>
    <g font-size="14" fill="#94a3b8" text-anchor="middle">
      <text x="80"   y="254">0</text>
      <text x="390"  y="254">10</text>
      <text x="700"  y="254">20</text>
      <text x="1010" y="254">30</text>
      <text x="1320" y="254">40</text>
    </g>
  </g>
  <text x="700" y="278" font-size="14" fill="#94a3b8" text-anchor="middle">去噪步数（0 → 40 步）：横条长度 = 该区间步数占比，t 由 1000 递减到 0</text>

  <!-- ================================================================
       下轴：I2V-A14B   shift = 5.0   40 步 = 15 步高噪 + 25 步低噪
       切换点 = 80 + 1240 × 15/40 = 545
       ================================================================ -->
  <text x="60" y="344" font-size="16" font-weight="700" fill="#0f172a">图生视频 A14B：40 步里，15 步高噪 + 25 步低噪</text>
  <g>
    <rect x="430" y="324" width="120" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="490" y="338" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" dominant-baseline="central">shift = 5.0</text>
  </g>

  <text x="80" y="382" font-size="14" fill="#475569">t = 1000</text>
  <text x="1320" y="382" font-size="14" fill="#475569" text-anchor="end">t = 0</text>
  <text x="545" y="382" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">切换点 t = 900</text>

  <line x1="545" y1="386" x2="545" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 横条：15 步（高噪，橙） + 25 步（低噪，紫） -->
  <g clip-path="url(#bar-i2v)">
    <rect x="80"  y="398" width="465" height="64" fill="#ea580c"/>
    <rect x="545" y="398" width="775" height="64" fill="#7c3aed"/>
  </g>
  <text x="312" y="422" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">高噪专家</text>
  <text x="312" y="445" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">15 步</text>
  <text x="932" y="422" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">低噪专家</text>
  <text x="932" y="445" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">25 步</text>

  <!-- 步数刻度 -->
  <g>
    <line x1="80" y1="480" x2="1320" y2="480" stroke="#e2e8f0" stroke-width="1"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="80"   y1="480" x2="80"   y2="487"/>
      <line x1="390"  y1="480" x2="390"  y2="487"/>
      <line x1="700"  y1="480" x2="700"  y2="487"/>
      <line x1="1010" y1="480" x2="1010" y2="487"/>
      <line x1="1320" y1="480" x2="1320" y2="487"/>
    </g>
    <g font-size="14" fill="#94a3b8" text-anchor="middle">
      <text x="80"   y="506">0</text>
      <text x="390"  y="506">10</text>
      <text x="700"  y="506">20</text>
      <text x="1010" y="506">30</text>
      <text x="1320" y="506">40</text>
    </g>
  </g>
  <text x="700" y="530" font-size="14" fill="#94a3b8" text-anchor="middle">去噪步数（0 → 40 步）：横条长度 = 该区间步数占比，t 由 1000 递减到 0</text>

  <!-- ===== 说明框 ===== -->
  <g>
    <rect x="340" y="566" width="300" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="490" y="594" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="central">不是路由器选 token，是整份权重换人</text>
  </g>
  <g>
    <rect x="680" y="566" width="380" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="870" y="594" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="central">每次换班要把不用的那份搬回内存（单卡 26 次）</text>
  </g>

  <!-- ===== Source ===== -->
  <text x="60" y="690" font-size="12" fill="#94a3b8">来源：wan/text2video.py:169-201、306；wan/utils/fm_solvers_unipc.py:184-213</text>
</svg>
