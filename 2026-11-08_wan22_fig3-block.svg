<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
  <title>Wan2.2 A14B：一个 Transformer Block 内部结构</title>
  <desc>主链自上而下：视频 token → 归一化 → 自注意力 → 残差加门控 → 归一化 → 交叉注意力 → 残差 → 归一化 → FFN → 残差加门控 → 预测的噪声；左侧 6 个时间步调制向量 e[0]-e[5] 分别作用于对应模块；右上角为 64 个频率通道按 22:21:21 分为时间/高/宽三段。</desc>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
    <clipPath id="barclip">
      <rect x="960" y="96" width="280" height="30" rx="6"/>
    </clipPath>
  </defs>

  <!-- ===================== 标题 ===================== -->
  <text x="64" y="46" font-size="17" font-weight="bold" fill="#1e293b">Wan2.2 A14B｜一个 Transformer Block 内部</text>

  <!-- ===================== 左侧：时间步调制（列说明） ===================== -->
  <rect x="58" y="197" width="40" height="475" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="78" y="434.5" transform="rotate(-90 78 434.5)" text-anchor="middle" font-size="13" fill="#475569">来自时间步的 6 个向量</text>

  <!-- ===================== 左侧：6 个 e 向量 ===================== -->
  <g font-size="14" font-weight="600" fill="#c2410c" text-anchor="middle">
    <rect x="126" y="197" width="56" height="26" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="154" y="214.5">e[0]</text>
    <rect x="126" y="231" width="56" height="26" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="154" y="248.5">e[1]</text>
    <rect x="126" y="290" width="56" height="26" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="154" y="307.5">e[2]</text>
    <rect x="126" y="567" width="56" height="26" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="154" y="584.5">e[3]</text>
    <rect x="126" y="595" width="56" height="26" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="154" y="612.5">e[4]</text>
    <rect x="126" y="646" width="56" height="26" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="154" y="663.5">e[5]</text>
  </g>

  <!-- ===================== 时间步 → 模块：细橙虚线 ===================== -->
  <g stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar-orange)">
    <path d="M182,210 L458,210"/>
    <path d="M182,244 L458,244"/>
    <path d="M182,303 L498,303"/>
    <path d="M182,580 L458,580"/>
    <path d="M182,608 L458,608"/>
    <path d="M182,659 L498,659"/>
  </g>

  <!-- 线上标注（白色描边压掉虚线，避免穿过文字） -->
  <g font-size="13" fill="#c2410c" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <text x="198" y="214">改数值（shift / scale）</text>
    <text x="198" y="248">改数值（shift / scale）</text>
    <text x="198" y="307">调门</text>
    <text x="198" y="584">改数值（shift / scale）</text>
    <text x="198" y="612">改数值（shift / scale）</text>
    <text x="198" y="663">调门</text>
  </g>

  <!-- ===================== 主链 ===================== -->
  <!-- 1 入口 -->
  <rect x="460" y="82" width="320" height="42" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">视频 token</text>
  <path d="M620,124 L620,141" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 2 归一化 norm1 -->
  <rect x="500" y="143" width="240" height="34" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">① 归一化 norm1</text>
  <path d="M620,177 L620,194" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 3 自注意力 -->
  <rect x="460" y="196" width="320" height="64" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="620" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#6d28d9">② 自注意力</text>
  <text x="620" y="242" text-anchor="middle" font-size="14" fill="#7c3aed">40 头 × 128 维</text>
  <text x="620" y="258" text-anchor="middle" font-size="14" fill="#7c3aed">加 3D 位置编码</text>
  <path d="M620,264 L620,281" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 4 残差 + 门控 -->
  <rect x="500" y="283" width="240" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">③ 残差 + 门控</text>
  <path d="M620,323 L620,340" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 5 归一化 norm3 -->
  <rect x="500" y="342" width="240" height="34" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="364" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">④ 归一化 norm3</text>
  <path d="M620,376 L620,393" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 6 交叉注意力 -->
  <rect x="460" y="395" width="320" height="50" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="620" y="414" text-anchor="middle" font-size="15" font-weight="600" fill="#c2410c">⑤ 交叉注意力</text>
  <text x="620" y="437" text-anchor="middle" font-size="14" fill="#ea580c">K / V 来自 512 个文本 token</text>
  <path d="M620,445 L620,462" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 7 残差 -->
  <rect x="500" y="464" width="240" height="34" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="486" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">⑥ 残差</text>
  <path d="M620,498 L620,515" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 8 归一化 norm2 -->
  <rect x="500" y="517" width="240" height="34" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="539" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">⑦ 归一化 norm2</text>
  <path d="M620,551 L620,568" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 9 FFN -->
  <rect x="460" y="570" width="320" height="50" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="620" y="590" text-anchor="middle" font-size="15" font-weight="600" fill="#6d28d9">⑧ 前馈网络 FFN</text>
  <text x="620" y="611" text-anchor="middle" font-size="14" fill="#7c3aed">5,120 → 13,824 → 5,120</text>
  <path d="M620,620 L620,637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 10 残差 + 门控 -->
  <rect x="500" y="639" width="240" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="664" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">⑨ 残差 + 门控</text>
  <path d="M620,679 L620,696" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar-gray)"/>

  <!-- 11 出口 -->
  <rect x="460" y="698" width="320" height="42" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="723" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e4ed8">预测的噪声</text>

  <!-- ===================== 旁注 ===================== -->
  <g stroke="#cbd5e1" stroke-width="1.2" fill="none">
    <path d="M782,103 L795,103"/>
    <path d="M742,303 L795,303"/>
    <path d="M742,659 L795,659"/>
  </g>
  <text x="800" y="108" font-size="16" fill="#334155">75,600 × 5,120</text>
  <text x="800" y="308" font-size="15" fill="#334155">乘 e[2]</text>
  <text x="800" y="664" font-size="15" fill="#334155">乘 e[5]</text>

  <!-- ===================== 右上角：位置编码频率通道分配 ===================== -->
  <text x="960" y="76" font-size="14" font-weight="bold" fill="#1e293b">位置编码的 64 个频率通道怎么分</text>

  <g clip-path="url(#barclip)">
    <rect x="960" y="96" width="96.25" height="30" fill="#7c3aed"/>
    <rect x="1056.25" y="96" width="91.875" height="30" fill="#2563eb"/>
    <rect x="1148.125" y="96" width="91.875" height="30" fill="#16a34a"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="1008.125" y="116">时间 22</text>
    <text x="1102.19" y="116">高 21</text>
    <text x="1194.06" y="116">宽 21</text>
  </g>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="1008.125" y="146">帧 F 方向</text>
    <text x="1102.19" y="146">高 H 方向</text>
    <text x="1194.06" y="146">宽 W 方向</text>
  </g>
  <text x="1252" y="116" font-size="13" fill="#64748b">64 = 头维度的一半</text>

  <!-- ===================== 图例 ===================== -->
  <g font-size="12" fill="#64748b">
    <rect x="960" y="757" width="8" height="8" rx="1.5" fill="#7c3aed"/>
    <text x="974" y="765">注意力 / FFN</text>
    <rect x="1070" y="757" width="8" height="8" rx="1.5" fill="#ea580c"/>
    <text x="1084" y="765">条件（时间步 / 文本）</text>
    <rect x="1220" y="757" width="8" height="8" rx="1.5" fill="#2563eb"/>
    <text x="1234" y="765">输出（噪声）</text>
  </g>

  <!-- ===================== 来源 ===================== -->
  <text x="64" y="766" font-size="12" fill="#94a3b8">来源：wan/modules/model.py:183-259、27-66</text>
</svg>
