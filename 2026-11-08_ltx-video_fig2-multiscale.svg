<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
  <title>LTX-Video 两遍多尺度渲染：形状怎么变</title>
  <desc>三列技术图：左列原始输入视频 121 × 704 × 1216；中列 VAE 压成潜变量 16 × 22 × 38（13,376 个 token），空间压 32 倍、时间压 8 倍后第一遍得到 800 × 448（潜变量 16 × 14 × 25，5,600 个 token）；右列上采样器 ×2 后第二遍在 1600 × 896（潜变量 16 × 28 × 50，22,400 个 token）上运行，最后双线性插值输出 704 × 1216。底部对比条显示 token 数 5,600 与 22,400 的 1:4 关系。</desc>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===================== 标题 ===================== -->
  <text x="40" y="40" font-size="18" font-weight="bold" fill="#1e293b">两遍多尺度渲染｜形状怎么变</text>
  <text x="1360" y="40" text-anchor="end" font-size="13" fill="#94a3b8">LTX-Video 多尺度管线（技术版）</text>

  <!-- ===================== 三列标题 ===================== -->
  <text x="40" y="70" font-size="15" font-weight="bold" fill="#1d4ed8">① 原始输入</text>
  <text x="490" y="70" font-size="15" font-weight="bold" fill="#6d28d9">② 压成潜变量 + 第一遍小图</text>
  <text x="940" y="70" font-size="15" font-weight="bold" fill="#15803d">③ 放大后第二遍 + 输出</text>

  <!-- ===================== 三个面板 ===================== -->
  <rect x="40" y="84" width="420" height="516" rx="14" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.2"/>
  <rect x="490" y="84" width="420" height="516" rx="14" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.2"/>
  <rect x="940" y="84" width="420" height="516" rx="14" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1.2"/>

  <!-- ============ 第 1 列：原始输入 ============ -->
  <text x="232" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e4ed8">输入视频（RGB）</text>

  <rect x="112" y="234" width="240" height="240" rx="12" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="232" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">121 × 704 × 1216</text>
  <text x="378" y="354" transform="rotate(-90 378 354)" text-anchor="middle" font-size="13" fill="#1e4ed8">121 帧 @30fps</text>

  <text x="232" y="504" text-anchor="middle" font-size="13" fill="#475569">时间 × 高 × 宽</text>
  <text x="64" y="586" font-size="13" fill="#64748b">像素域</text>

  <!-- ============ 第 2 列：潜变量 + 第一遍 ============ -->
  <text x="700" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">VAE 编码</text>

  <rect x="530" y="228" width="340" height="56" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="700" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d28d9">潜变量 16 × 22 × 38</text>
  <text x="700" y="300" text-anchor="middle" font-size="13" fill="#64748b">13,376 个 token</text>

  <path d="M700,314 L700,344" stroke="#7c3aed" stroke-width="2.2" fill="none" marker-end="url(#ar-purple)"/>
  <text x="684" y="338" text-anchor="end" font-size="13" fill="#64748b">空间压 32 倍，时间压 8 倍</text>

  <text x="700" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">第一遍（小分辨率）</text>
  <rect x="530" y="388" width="340" height="56" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="700" y="422" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d28d9">800 × 448</text>
  <text x="700" y="460" text-anchor="middle" font-size="13" fill="#64748b">潜变量 16 × 14 × 25</text>
  <text x="700" y="477" text-anchor="middle" font-size="13" fill="#64748b">5,600 个 token</text>
  <text x="514" y="586" font-size="13" fill="#64748b">第一遍：定内容</text>

  <!-- ============ 第 3 列：上采样 + 第二遍 + 输出 ============ -->
  <text x="1150" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">上采样</text>

  <rect x="980" y="170" width="340" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1150" y="204" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803d">上采样器 ×2</text>
  <text x="1150" y="242" text-anchor="middle" font-size="13" fill="#64748b">只放大空间，不动时间轴</text>

  <path d="M1150,256 L1150,290" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#ar-green)"/>

  <text x="1150" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">第二遍（高清）</text>
  <rect x="980" y="322" width="340" height="56" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1150" y="356" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d28d9">1600 × 896</text>
  <text x="1150" y="394" text-anchor="middle" font-size="13" fill="#64748b">潜变量 16 × 28 × 50</text>
  <text x="1150" y="411" text-anchor="middle" font-size="13" fill="#64748b">22,400 个 token</text>

  <path d="M1150,425 L1150,452" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#ar-green)"/>

  <text x="1150" y="479" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">输出</text>
  <rect x="980" y="493" width="340" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1150" y="527" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803d">704 × 1216</text>
  <text x="1150" y="567" text-anchor="middle" font-size="13" fill="#64748b">双线性插值缩回目标尺寸</text>
  <text x="964" y="586" font-size="13" fill="#64748b">第二遍：修细节</text>

  <!-- ===================== 底部对比条 ===================== -->
  <rect x="40" y="620" width="1320" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="70" y="632" width="150" height="14" rx="4" fill="#7c3aed"/>
  <text x="230" y="644" font-size="14" fill="#6d28d9">第一遍 5,600</text>

  <rect x="70" y="656" width="600" height="14" rx="4" fill="#7c3aed"/>
  <text x="680" y="668" font-size="14" fill="#6d28d9">第二遍 22,400</text>

  <text x="790" y="655" font-size="14" fill="#64748b">token 数 ×4 —— 第二遍比第一遍贵得多，所以第一遍要快</text>

  <!-- ===================== 图例 + 来源 ===================== -->
  <g font-size="12" fill="#64748b">
    <rect x="40" y="704" width="8" height="8" rx="1.5" fill="#2563eb"/>
    <text x="54" y="712">像素域</text>
    <rect x="106" y="704" width="8" height="8" rx="1.5" fill="#7c3aed"/>
    <text x="120" y="712">潜变量</text>
    <rect x="172" y="704" width="8" height="8" rx="1.5" fill="#16a34a"/>
    <text x="186" y="712">VAE / 上采样</text>
  </g>
  <text x="1360" y="712" text-anchor="end" font-size="12" fill="#94a3b8">来源：ltx_video/pipelines/pipeline_ltx_video.py:1843-1894、1868-1877</text>
</svg>
