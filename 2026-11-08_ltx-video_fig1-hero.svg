<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowPurple" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="30" markerHeight="25" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- ===== 左半：第一遍，小图 ===== -->
  <g>
    <text x="158" y="166" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">第一遍：小图上画内容</text>

    <!-- 小画面 -->
    <rect x="58" y="188" width="200" height="134" fill="#eef6ff" stroke="#2563eb" stroke-width="3"/>
    <!-- 地面 -->
    <rect x="59" y="276" width="198" height="45" fill="#e2e8f0"/>
    <!-- 地平线 -->
    <line x1="59" y1="276" x2="257" y2="276" stroke="#334155" stroke-width="2"/>
    <!-- 太阳 -->
    <ellipse cx="225" cy="214" rx="11" ry="11" fill="#fbbf24"/>
    <!-- 小人剪影 -->
    <circle cx="112" cy="239" r="6" fill="#334155"/>
    <rect x="107.5" y="245" width="9" height="17" rx="3.5" fill="#334155"/>
    <rect x="108" y="260" width="3.2" height="16" fill="#334155"/>
    <rect x="112.8" y="260" width="3.2" height="16" fill="#334155"/>

    <text x="158" y="342" font-size="14" fill="#64748b" text-anchor="middle">快、便宜，先把内容定下来</text>
  </g>

  <!-- ===== 右半：第二遍，放大精修 ===== -->
  <g>
    <text x="970" y="99" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">第二遍：放大一倍，精修细节</text>

    <!-- 大画面 -->
    <rect x="770" y="121" width="400" height="268" fill="#eef6ff" stroke="#2563eb" stroke-width="4"/>
    <!-- 地面 -->
    <rect x="772" y="297" width="396" height="90" fill="#e2e8f0"/>
    <!-- 地平线 -->
    <line x1="772" y1="297" x2="1168" y2="297" stroke="#334155" stroke-width="3"/>
    <!-- 太阳 -->
    <ellipse cx="1104" cy="173" rx="22" ry="22" fill="#fbbf24"/>
    <!-- 云 -->
    <ellipse cx="858" cy="162" rx="26" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="902" cy="152" rx="18" ry="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- 远处飞鸟 -->
    <path d="M944,158 l7,-6 l7,6" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M980,176 l6,-5 l6,5" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 小人剪影（放大后） -->
    <circle cx="878" cy="223" r="12" fill="#334155"/>
    <rect x="869" y="235" width="18" height="34" rx="7" fill="#334155"/>
    <rect x="870" y="265" width="6.4" height="32" fill="#334155"/>
    <rect x="879.6" y="265" width="6.4" height="32" fill="#334155"/>
    <!-- 草地细节 -->
    <g fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
      <line x1="796" y1="322" x2="796" y2="306"/>
      <line x1="802" y1="322" x2="802" y2="300"/>
      <line x1="808" y1="322" x2="808" y2="308"/>
      <line x1="854" y1="344" x2="854" y2="328"/>
      <line x1="860" y1="344" x2="860" y2="322"/>
      <line x1="866" y1="344" x2="866" y2="330"/>
      <line x1="954" y1="318" x2="954" y2="302"/>
      <line x1="960" y1="318" x2="960" y2="296"/>
      <line x1="966" y1="318" x2="966" y2="304"/>
      <line x1="1054" y1="348" x2="1054" y2="332"/>
      <line x1="1060" y1="348" x2="1060" y2="326"/>
      <line x1="1066" y1="348" x2="1066" y2="334"/>
      <line x1="1128" y1="322" x2="1128" y2="306"/>
      <line x1="1134" y1="322" x2="1134" y2="300"/>
      <line x1="1140" y1="322" x2="1140" y2="308"/>
    </g>
    <!-- 石子 -->
    <ellipse cx="820" cy="340" rx="9" ry="4" fill="#cbd5e1"/>
    <ellipse cx="1012" cy="352" rx="11" ry="5" fill="#cbd5e1"/>

    <text x="970" y="409" font-size="14" fill="#64748b" text-anchor="middle">在两倍大的画布上继续改</text>
  </g>

  <!-- ===== 中间：放大箭头 ===== -->
  <g>
    <text x="515" y="225" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">放大一倍</text>
    <path d="M262,255 L769,255" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
    <text x="515" y="285" font-size="14" fill="#64748b" text-anchor="middle">只放大画面，不动时间轴</text>

    <rect x="430" y="305" width="170" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="515" y="329" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">上采样器</text>
    <text x="515" y="350" font-size="14" fill="#64748b" text-anchor="middle">在潜变量里放大</text>
  </g>

  <!-- ===== 底部通栏 ===== -->
  <rect x="30" y="496" width="1140" height="44" rx="8" fill="#f1f5f9"/>
  <text x="600" y="524" font-size="15" fill="#334155" text-anchor="middle">同一个模型跑两遍：先定内容，再修细节 —— 这就是它比一次生成 4K 更快的原因</text>
</svg>
