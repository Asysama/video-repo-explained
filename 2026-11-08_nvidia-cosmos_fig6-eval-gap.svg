<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= 左栏：仓库给了实测数字（实心 · 绿） ================= -->
  <g>
    <rect x="40" y="32" width="416" height="578" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="64" font-size="18" font-weight="bold" fill="#16a34a">有数字的</text>
    <text x="60" y="86" font-size="12" fill="#94a3b8">仓库直接给了实测值</text>

    <!-- 1 -->
    <rect x="60" y="104" width="376" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="76" y="144" font-size="14" fill="#334155">模型档位与参数量</text>
    <text x="420" y="145" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="end">4B / 16B / 64B</text>
    <!-- 2 -->
    <rect x="60" y="208" width="376" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="76" y="248" font-size="14" fill="#334155">输入输出契约</text>
    <text x="420" y="249" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="end">11 种用法</text>
    <!-- 3 -->
    <rect x="60" y="312" width="376" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="76" y="352" font-size="14" fill="#334155">各显卡生成耗时</text>
    <text x="420" y="353" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="end">数千次实测</text>
    <!-- 4 -->
    <rect x="60" y="416" width="376" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="76" y="456" font-size="14" fill="#334155">推理吞吐与首字延迟</text>
    <text x="420" y="457" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="end">并发 256</text>
    <!-- 5 -->
    <rect x="60" y="520" width="376" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="76" y="560" font-size="14" fill="#334155">端侧设备表现</text>
    <text x="420" y="561" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="end">11 款板卡</text>
  </g>

  <!-- ================= 中栏：只有名字、没有数值（虚线 · 橙） ================= -->
  <g>
    <rect x="492" y="32" width="416" height="578" rx="12" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
    <text x="512" y="64" font-size="18" font-weight="bold" fill="#ea580c">只有名字的</text>
    <text x="512" y="86" font-size="12" fill="#94a3b8">只给了评测名字，数值在别处</text>

    <!-- 1 -->
    <rect x="512" y="104" width="376" height="68" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="528" y="131" font-size="14" fill="#334155">PAI-Bench-G（视频质量）</text>
    <text x="528" y="152" font-size="12" fill="#94a3b8">结果指向仓库外</text>
    <!-- 2 -->
    <rect x="512" y="188" width="376" height="68" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="528" y="215" font-size="14" fill="#334155">PAI-Bench-C（可控生成）</text>
    <text x="528" y="236" font-size="12" fill="#94a3b8">结果指向仓库外</text>
    <!-- 3 -->
    <rect x="512" y="272" width="376" height="68" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="528" y="299" font-size="14" fill="#334155">PhysicsIQ（物理推理）</text>
    <text x="528" y="320" font-size="12" fill="#94a3b8">结果指向仓库外</text>
    <!-- 4 -->
    <rect x="512" y="356" width="376" height="68" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="528" y="383" font-size="14" fill="#334155">UniGenBench（图像质量）</text>
    <text x="528" y="404" font-size="12" fill="#94a3b8">结果指向仓库外</text>
    <!-- 5 -->
    <rect x="512" y="440" width="376" height="68" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="528" y="467" font-size="14" fill="#334155">RBench（机器人）</text>
    <text x="528" y="488" font-size="12" fill="#94a3b8">结果指向仓库外</text>
    <!-- 6 -->
    <rect x="512" y="524" width="376" height="68" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="528" y="551" font-size="14" fill="#334155">TAR &amp; VANTAGE（视频推理）</text>
    <text x="528" y="572" font-size="12" fill="#94a3b8">结果指向仓库外</text>
  </g>

  <!-- ================= 右栏：仓库完全没有提（灰虚线 · 斜体） ================= -->
  <g>
    <rect x="944" y="32" width="416" height="578" rx="12" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="964" y="64" font-size="18" font-weight="bold" fill="#64748b">一个字都没写</text>
    <text x="964" y="86" font-size="12" fill="#94a3b8">仓库正文完全没有涉及</text>

    <!-- 1 -->
    <rect x="964" y="104" width="376" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="980" y="137" font-size="14" font-style="italic" fill="#6b7280">潜变量形状与压缩率</text>
    <text x="1324" y="137" font-size="12" font-style="italic" fill="#9ca3af" text-anchor="end">未说明</text>
    <!-- 2 -->
    <rect x="964" y="190" width="376" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="980" y="223" font-size="14" font-style="italic" fill="#6b7280">训练数据与规模</text>
    <text x="1324" y="223" font-size="12" font-style="italic" fill="#9ca3af" text-anchor="end">未说明</text>
    <!-- 3 -->
    <rect x="964" y="276" width="376" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="980" y="309" font-size="14" font-style="italic" fill="#6b7280">强化学习的算法（GRPO / RLHF）</text>
    <text x="1324" y="309" font-size="12" font-style="italic" fill="#9ca3af" text-anchor="end">未说明</text>
    <!-- 4 -->
    <rect x="964" y="362" width="376" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="980" y="395" font-size="14" font-style="italic" fill="#6b7280">逐帧 rollout 的循环细节</text>
    <text x="1324" y="395" font-size="12" font-style="italic" fill="#9ca3af" text-anchor="end">未说明</text>
    <!-- 5 -->
    <rect x="964" y="448" width="376" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="980" y="481" font-size="14" font-style="italic" fill="#6b7280">采样器是否 flow matching</text>
    <text x="1324" y="481" font-size="12" font-style="italic" fill="#9ca3af" text-anchor="end">未说明</text>
    <!-- 6 -->
    <rect x="964" y="534" width="376" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="980" y="567" font-size="14" font-style="italic" fill="#6b7280">缓存与重算策略</text>
    <text x="1324" y="567" font-size="12" font-style="italic" fill="#9ca3af" text-anchor="end">未说明</text>
  </g>

  <!-- ================= 底部通栏 ================= -->
  <rect x="40" y="630" width="1320" height="64" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="667" font-size="15" fill="#334155" text-anchor="middle">这个仓库是一份落地页 + 测速表：能查到「<tspan font-weight="bold" fill="#16a34a">跑一次要几秒</tspan>」，查不到「<tspan font-weight="bold" fill="#ea580c">生成得好不好</tspan>」</text>

  <!-- ================= 图例 ================= -->
  <g>
    <rect x="40" y="713" width="11" height="11" rx="2" fill="#16a34a"/>
    <text x="59" y="723" font-size="14" fill="#475569">有实测数字</text>
    <rect x="140" y="713" width="11" height="11" rx="2" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="159" y="723" font-size="14" fill="#475569">只有名字</text>
    <rect x="240" y="713" width="11" height="11" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="259" y="723" font-size="14" fill="#475569">完全未提</text>
  </g>
  <text x="1360" y="723" font-size="12" fill="#94a3b8" text-anchor="end">来源：nvidia/cosmos 仓库 README 与 inference benchmarks 文档</text>
</svg>
